<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <script>(function(){try{var t=localStorage.getItem('gv_theme')||'candy';var m=localStorage.getItem('gv_mode')||'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.setAttribute('data-mode',m);}catch(e){}})();</script>

  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>Sling Shot — GameVerse</title>
  <link rel="stylesheet" href="../css/global.css"/>
  <style>
    body { background:#87CEEB; overflow:hidden; touch-action:none; }
    #canvas { display:block; width:100%; max-width:480px; margin:0 auto; }
    .game-ui { position:fixed; top:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; pointer-events:none; padding:10px 16px; display:flex; justify-content:space-between; align-items:center; }
    .ui-pill { background:rgba(0,0,0,.5); backdrop-filter:blur(4px); color:#fff; padding:6px 14px; border-radius:99px; font-size:13px; font-weight:700; }
    #back-home { position:fixed; top:10px; left:10px; z-index:100; pointer-events:all; }
    .overlay {
      position:fixed; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:14px;
      background:rgba(0,0,20,.85); padding:24px;
    }
    .ov-emoji { font-size:60px; }
    .ov-title { font-size:26px; font-weight:800; color:#fff; }
    .ov-stars { font-size:32px; }
    .play-btn { width:100%; max-width:300px; height:50px; border-radius:14px; border:none; background:#F97316; color:#fff; font-size:16px; font-weight:700; }
  
    /* Kids UI upgrades */
    .play-btn {
      width:100%; max-width:320px; height:56px; border-radius:99px;
      border:none; font-family:var(--font-display); font-size:17px; font-weight:800;
      cursor:pointer; transition:transform .15s cubic-bezier(.34,1.56,.64,1);
      box-shadow: 0 6px 0 rgba(0,0,0,0.2);
    }
    .play-btn:active { transform:scale(.93) translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,0.2); }
    .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:rgba(20,10,30,.82); padding:24px; backdrop-filter:blur(4px); }
    .ov-emoji { font-size:68px; animation:bounceIn .5s cubic-bezier(.34,1.56,.64,1); }
    .ov-title { font-family:var(--font-display); font-size:28px; font-weight:800; color:#fff; text-shadow:0 3px 10px rgba(0,0,0,0.4); }

  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="game-ui">
  <div class="ui-pill" id="ui-birds">🐦 x3</div>
  <div class="ui-pill" id="ui-level">Level 1</div>
  <div class="ui-pill" id="ui-score">0</div>
</div>
<button id="back-home" class="back-btn" onclick="saveAndExit()" style="background:rgba(0,0,0,.5);color:#fff;border-color:rgba(255,255,255,.3);">← Home</button>

<div id="start-overlay" class="overlay">
  <div class="ov-emoji">🐦</div>
  <div class="ov-title">Sling Shot</div>
  <div style="color:#ddd;font-size:14px;text-align:center;max-width:280px;">Drag the bird back, aim, and release to launch it at the targets!</div>
  <button class="play-btn" onclick="startLevel()">▶ Play</button>
</div>

<div id="win-overlay" class="overlay hidden">
  <div class="ov-emoji">🎉</div>
  <div class="ov-title">Level Complete!</div>
  <div class="ov-stars" id="win-stars">⭐⭐⭐</div>
  <button class="play-btn" onclick="nextLevel()">Next Level →</button>
  <button class="play-btn" style="background:transparent;border:1px solid rgba(255,255,255,.3);font-size:14px;height:42px;" onclick="saveAndExit()">← Back to Hub</button>
</div>

<div id="lose-overlay" class="overlay hidden">
  <div class="ov-emoji">😢</div>
  <div class="ov-title">Out of Birds!</div>
  <button class="play-btn" onclick="startLevel()">↻ Retry</button>
  <button class="play-btn" style="background:transparent;border:1px solid rgba(255,255,255,.3);font-size:14px;height:42px;" onclick="saveAndExit()">← Back to Hub</button>
</div>

<script src="../js/core.js"></script>
<script>
const GAME_ID='slingshot';
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
let W,H,dpr,groundY;

function resize(){
  let mw=Math.min(window.innerWidth,480);
  dpr=window.devicePixelRatio||1;
  W=mw; H=window.innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.scale(dpr,dpr);
  groundY=H*0.82;
}
resize(); window.addEventListener('resize',resize);

let level=1, score=0, birdsLeft=3, state='idle';
let slingX, slingY, bird, blocks, targets, particles, raf;
let dragging=false, dragX=0, dragY=0;
const GRAVITY=0.45;

function initLevel(){
  slingX=W*0.18; slingY=groundY-80;
  resetBird();
  blocks=[]; targets=[]; particles=[];
  let numTargets=2+Math.floor(level/2);
  let baseX=W*0.65;
  for(let i=0;i<numTargets;i++){
    let bx=baseX+i*55;
    blocks.push({x:bx,y:groundY-40,w:14,h:80,type:'wood'});
    blocks.push({x:bx,y:groundY-100,w:70,h:14,type:'wood'});
    targets.push({x:bx+5,y:groundY-30,r:18,alive:true,hit:false});
  }
}

function resetBird(){
  bird={x:slingX,y:slingY,vx:0,vy:0,r:16,launched:false,settled:false,settleTimer:0};
}

function startLevel(){
  document.getElementById('start-overlay').classList.add('hidden');
  document.getElementById('win-overlay').classList.add('hidden');
  document.getElementById('lose-overlay').classList.add('hidden');
  let save=GV.Save.get(GAME_ID);
  if(save&&state==='idle'&&!save.usedFresh){ level=save.level||1; score=save.score||0; }
  birdsLeft=3; state='aiming';
  initLevel();
  updateUI();
  loop();
}

canvas.addEventListener('pointerdown',e=>{
  if(state!=='aiming'||bird.launched) return;
  let rect=canvas.getBoundingClientRect();
  let x=e.clientX-rect.left, y=e.clientY-rect.top;
  if(Math.hypot(x-bird.x,y-bird.y)<40){ dragging=true; }
});
canvas.addEventListener('pointermove',e=>{
  if(!dragging) return;
  let rect=canvas.getBoundingClientRect();
  let x=e.clientX-rect.left, y=e.clientY-rect.top;
  let dx=x-slingX, dy=y-slingY;
  let dist=Math.min(70,Math.hypot(dx,dy));
  let angle=Math.atan2(dy,dx);
  bird.x=slingX+Math.cos(angle)*dist;
  bird.y=slingY+Math.sin(angle)*dist;
});
canvas.addEventListener('pointerup',()=>{
  if(!dragging) return;
  dragging=false;
  let dx=slingX-bird.x, dy=slingY-bird.y;
  bird.vx=dx*0.18; bird.vy=dy*0.18;
  bird.launched=true;
  playLaunch();
});

function update(){
  if(bird.launched){
    bird.vy+=GRAVITY;
    bird.x+=bird.vx; bird.y+=bird.vy;
    /* ground collision */
    if(bird.y+bird.r>groundY){ bird.y=groundY-bird.r; bird.vy*=-0.4; bird.vx*=0.7; if(Math.abs(bird.vy)<1)bird.settled=true; }
    /* wall */
    if(bird.x>W-bird.r){ bird.x=W-bird.r; bird.vx*=-0.5; }
    /* block collision */
    blocks.forEach(b=>{
      if(bird.x+bird.r>b.x-b.w/2&&bird.x-bird.r<b.x+b.w/2&&bird.y+bird.r>b.y-b.h/2&&bird.y-bird.r<b.y+b.h/2){
        bird.vx*=-0.5; bird.vy*=-0.3;
        b.x+=bird.vx*0.3; // knock
      }
    });
    /* target collision */
    targets.forEach(t=>{
      if(!t.hit&&Math.hypot(bird.x-t.x,bird.y-t.y)<bird.r+t.r){
        t.hit=true; t.alive=false; score+=100;
        spawnParticles(t.x,t.y,'#F97316');
        playHit();
        if(navigator.vibrate)navigator.vibrate(40);
        GV.Auth.updateCoins(5);
        updateUI();
      }
    });
    if(bird.settled||bird.x<-50||bird.x>W+50){
      bird.settleTimer++;
      if(bird.settleTimer>30){ endTurn(); }
    }
  }
  particles=particles.filter(p=>{ p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.life-=0.03; return p.life>0; });
}

function spawnParticles(x,y,color){
  for(let i=0;i<12;i++) particles.push({x,y,vx:(Math.random()-0.5)*8,vy:-Math.random()*8,r:5,color,life:1});
}

function endTurn(){
  birdsLeft--;
  let allDead=targets.every(t=>!t.alive);
  if(allDead){ onWin(); return; }
  if(birdsLeft<=0){ onLose(); return; }
  resetBird();
  updateUI();
}

function onWin(){
  state='idle';
  let stars=birdsLeft>=2?3:birdsLeft>=1?2:1;
  document.getElementById('win-stars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);
  document.getElementById('win-overlay').classList.remove('hidden');
  saveProgress();
}
function onLose(){
  state='idle';
  document.getElementById('lose-overlay').classList.remove('hidden');
  saveProgress();
}
function nextLevel(){ level++; document.getElementById('win-overlay').classList.add('hidden'); startLevel(); }

function draw(){
  /* sky */
  let sky=ctx.createLinearGradient(0,0,0,groundY);
  sky.addColorStop(0,'#87CEEB'); sky.addColorStop(1,'#B0E0E6');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,groundY);
  /* clouds */
  ctx.fillStyle='rgba(255,255,255,0.7)';
  [[W*0.2,60,30],[W*0.7,40,24],[W*0.5,90,20]].forEach(([cx,cy,r])=>{
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.arc(cx+r*0.8,cy+5,r*0.7,0,Math.PI*2); ctx.arc(cx-r*0.8,cy+5,r*0.7,0,Math.PI*2); ctx.fill();
  });
  /* ground */
  ctx.fillStyle='#4ADE80'; ctx.fillRect(0,groundY,W,H-groundY);
  ctx.fillStyle='#22C55E'; ctx.fillRect(0,groundY,W,8);

  /* sling */
  ctx.strokeStyle='#8B4513'; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(slingX-15,groundY); ctx.lineTo(slingX-15,slingY-10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(slingX+15,groundY); ctx.lineTo(slingX+15,slingY-10); ctx.stroke();

  /* sling bands */
  if(!bird.launched){
    ctx.strokeStyle='#5C3317'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(slingX-15,slingY-10); ctx.lineTo(bird.x,bird.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(slingX+15,slingY-10); ctx.lineTo(bird.x,bird.y); ctx.stroke();
  }

  /* blocks */
  blocks.forEach(b=>{
    ctx.fillStyle='#A0522D';
    ctx.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);
    ctx.strokeStyle='#5C3317'; ctx.lineWidth=2;
    ctx.strokeRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);
  });

  /* targets (pigs) */
  targets.forEach(t=>{
    if(!t.alive) return;
    ctx.fillStyle='#86EFAC';
    ctx.beginPath(); ctx.arc(t.x,t.y,t.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#22C55E';
    ctx.beginPath(); ctx.ellipse(t.x,t.y+4,8,5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath(); ctx.arc(t.x-6,t.y-4,2,0,Math.PI*2); ctx.arc(t.x+6,t.y-4,2,0,Math.PI*2); ctx.fill();
  });

  /* bird */
  ctx.fillStyle='#EF4444';
  ctx.beginPath(); ctx.arc(bird.x,bird.y,bird.r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FFF';
  ctx.beginPath(); ctx.arc(bird.x-5,bird.y-3,4,0,Math.PI*2); ctx.arc(bird.x+5,bird.y-3,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.arc(bird.x-5,bird.y-3,2,0,Math.PI*2); ctx.arc(bird.x+5,bird.y-3,2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#F97316';
  ctx.beginPath(); ctx.moveTo(bird.x,bird.y); ctx.lineTo(bird.x+10,bird.y+2); ctx.lineTo(bird.x,bird.y+5); ctx.fill();

  /* particles */
  particles.forEach(p=>{
    ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

function updateUI(){
  document.getElementById('ui-birds').textContent='🐦 x'+birdsLeft;
  document.getElementById('ui-level').textContent='Level '+level;
  document.getElementById('ui-score').textContent=score.toLocaleString();
}

function loop(){
  if(state!=='aiming') return;
  update(); draw();
  raf=requestAnimationFrame(loop);
}

let audioCtx=null;
function tone(f,type,d,v=0.2){
  try{
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    let o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.frequency.value=f;o.type=type;
    g.gain.setValueAtTime(v,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);
    o.start();o.stop(audioCtx.currentTime+d);
  }catch(e){}
}
function playLaunch(){ tone(200,'sawtooth',0.2,0.15); }
function playHit(){ tone(800,'square',0.15,0.2); }

function saveProgress(){
  GV.Save.set(GAME_ID,{level,score,savedAt:new Date().toISOString()});
}
function saveAndExit(){ cancelAnimationFrame(raf); state='idle'; saveProgress(); window.location.href='../index.html'; }

/* INIT */
let save=GV.Save.get(GAME_ID);
if(save){ level=save.level||1; score=save.score||0; }
</script>
</body>
</html>
