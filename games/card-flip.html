<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <script>(function(){try{var t=localStorage.getItem('gv_theme')||'candy';var m=localStorage.getItem('gv_mode')||'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.setAttribute('data-mode',m);}catch(e){}})();</script>

  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>Card Flip — GameVerse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/global.css"/>
  <style>
    body { background: var(--bg); padding-bottom:24px; }
    /* topbar now in global.css */
    .hud { display:flex; justify-content:space-between; padding:0 16px; margin-bottom:16px; gap:8px; }
    .hud-box { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:10px; text-align:center; }
    .hud-label { font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text3); }
    .hud-val { font-size:18px; font-weight:800; }
    .card-grid { display:grid; gap:8px; padding:0 16px; }
    .card {
      aspect-ratio:0.75; border-radius:14px; cursor:pointer;
      position:relative; perspective:600px;
    }
    .card-inner {
      width:100%; height:100%; transition:transform .4s; transform-style:preserve-3d; position:relative;
    }
    .card.flipped .card-inner { transform:rotateY(180deg); }
    .card-face {
      position:absolute; width:100%; height:100%; border-radius:14px;
      display:flex; align-items:center; justify-content:center; font-size:26px;
      backface-visibility:hidden;
    }
    .card-back { background:linear-gradient(135deg,#14B8A6,#0D9488); }
    .card-front { background:var(--surface2); transform:rotateY(180deg); border:2px solid #14B8A6; }
    .card.matched .card-front { background:rgba(34,197,94,.2); border-color:#22C55E; }
    #win-overlay {
      position:fixed; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:16px;
      background:rgba(20,10,30,.82); padding:24px;
    }
    .win-emoji { font-size:60px; }
    .win-title { font-size:26px; font-weight:800; }
    /* play-btn handled by global */ .play-btn { width:100%; max-width:300px; height:50px; border-radius:14px; border:none; background: var(--grad-primary); color:var(--text); font-size:16px; font-weight:700; }
  
    /* Kids UI upgrades */
    .play-btn {
      width:100%; max-width:320px; height:56px; border-radius:99px;
      border:none; font-family:var(--font-display); font-size:17px; font-weight:800;
      cursor:pointer; transition:transform .15s cubic-bezier(.34,1.56,.64,1);
      box-shadow: 0 6px 0 rgba(0,0,0,0.2);
    }
    .play-btn:active { transform:scale(.93) translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,0.2); }
    .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:rgba(20,10,30,.82); padding:24px; backdrop-filter:blur(4px); }
    .ov-emoji { font-size:68px; animation:bounceIn .5s cubic-bezier(.34,1.56,.64,1); }
    .ov-title { font-family:var(--font-display); font-size:28px; font-weight:800; color:var(--text); text-shadow:0 3px 10px rgba(0,0,0,0.4); }

  
    /* ── Theme-aware upgrades ── */
    body { font-family: var(--font-body) !important; }
    .hud-box, .hud { background: var(--surface-solid) !important; border: 2px solid var(--border) !important; border-radius: 16px !important; }
    .hud-label { color: var(--text3) !important; font-family: var(--font-display) !important; }
    .hud-val { color: var(--text) !important; font-family: var(--font-display) !important; }
    .balance-card, .q-box, .question-box, .goal-card, .combo-row, .settings-row,
    .combo-bar, .leaderboard-wrap, .result-card, .splash-card, .shop-section,
    .village-section, .building-card, .crop-card, .mode-card, .continue-card {
      background: var(--surface-solid) !important;
      border-color: var(--border) !important;
      color: var(--text) !important;
    }
    .section-label, .balance-label, .hud-label, .combo-label, .q-label {
      color: var(--text3) !important;
    }
    .balance-val, .big-score, .result-score, .go-score { color: var(--text) !important; }
    .balance-sub, .stat-l, .building-level, .crop-info, .mode-desc { color: var(--text2) !important; }
    .building-name, .crop-name, .mode-name, .cc-title, .gc-title { color: var(--text) !important; font-family: var(--font-display) !important; }
    .win-title, .ov-title, .overlay-title { font-family: var(--font-display) !important; color: var(--text) !important; }
    /* Buttons */
    .spin-btn { background: var(--grad-primary) !important; border-radius: 99px !important; font-family: var(--font-display) !important; font-weight: 800 !important; box-shadow: 0 6px 0 rgba(0,0,0,0.2) !important; border: none !important; }
    .play-btn { background: var(--grad-primary) !important; color: #fff !important; border-radius: 99px !important; font-family: var(--font-display) !important; font-weight: 800 !important; border: none !important; box-shadow: 0 6px 0 rgba(0,0,0,0.2) !important; }
    .ctrl-btn, .ghost-btn { background: var(--surface2) !important; border: 2px solid var(--border2) !important; color: var(--text) !important; border-radius: 99px !important; font-family: var(--font-display) !important; font-weight: 700 !important; }
    /* Shop / village cards */
    .village-grid .building-card, .shop-grid .crop-card, .mode-grid .mode-card {
      border: 2px solid var(--border) !important; border-radius: 18px !important;
    }
    .building-card:active, .crop-card:active, .mode-card:active { transform: scale(0.93) rotate(-1deg) !important; }
    /* Tiles and letters */
    .tile { background: var(--grad-primary) !important; color: #fff !important; }
    .tile.empty { background: transparent !important; box-shadow: none !important; }
    .letter-cell { background: var(--surface2) !important; color: var(--text) !important; border-radius: 8px !important; font-family: var(--font-display) !important; }
    .letter-cell.selecting { background: var(--accent) !important; color: #fff !important; }
    .letter-cell.found { background: rgba(52,211,153,0.25) !important; }
    /* Card flip */
    .card-back { background: var(--grad-primary) !important; }
    .card.matched .card-front { background: rgba(52,211,153,0.2) !important; border-color: #34D399 !important; }
    /* Plot / farm */
    .plot { background: var(--surface-solid) !important; border: 2px solid var(--border) !important; border-radius: 14px !important; }
    /* Word chips */
    .word-chip { background: var(--surface2) !important; border: 2px solid var(--border) !important; color: var(--text2) !important; border-radius: 99px !important; }
    .word-chip.found { background: rgba(52,211,153,0.2) !important; border-color: #34D399 !important; color: #16A34A !important; text-decoration: line-through; }
    /* Coin kingdom */
    .coin-result { color: var(--gold) !important; font-family: var(--font-display) !important; }
    .result-card, .result-popup .result-card { background: var(--surface-solid) !important; border: 2px solid var(--border2) !important; border-radius: 24px !important; }

  </style>
</head>
<body>
<div class="game-topbar">
  <button class="back-btn" onclick="saveAndExit()">← Home</button>
  <div style="font-weight:700;">🃏 Card Flip</div>
  <div style="width:70px;"></div>
</div>

<div class="hud">
  <div class="hud-box"><div class="hud-label">Level</div><div class="hud-val" id="level-display">1</div></div>
  <div class="hud-box"><div class="hud-label">Moves</div><div class="hud-val" id="moves-display">0</div></div>
  <div class="hud-box"><div class="hud-label">Matched</div><div class="hud-val" id="matched-display">0</div></div>
</div>

<div class="card-grid" id="card-grid"></div>

<div id="win-overlay" class="hidden">
  <div class="win-emoji">🎉</div>
  <div class="win-title">All Matched!</div>
  <div style="color:var(--text2);font-size:14px;">Solved in <span id="win-moves" style="color:#14B8A6;font-weight:700;"></span> moves</div>
  <button class="play-btn" onclick="nextLevel()">Next Level →</button>
  <button class="play-btn" style="background:transparent;border:1px solid rgba(255,255,255,.2);font-size:14px;height:42px;" onclick="saveAndExit()">← Back to Hub</button>
</div>

<script src="../js/core.js"></script>
<script>
const GAME_ID='cardMatch';
const ICONS=['🍎','🍌','🍇','🍓','🍉','🥝','🍑','🍒','🥑','🍍','🥭','🍐','🫐','🍋','🍅','🥥'];
let level=1, moves=0, matched=0, cards=[], flipped=[], busy=false, cols=4;

function $(id){return document.getElementById(id);}

function buildLevel(fromSave){
  let pairCount=Math.min(8,4+Math.floor(level/2));
  cols = pairCount<=6?4:pairCount<=8?4:5;
  if(!fromSave){
    let icons=ICONS.slice(0,pairCount);
    let deck=[...icons,...icons];
    deck=deck.map(v=>({value:v,flipped:false,matched:false}));
    for(let i=deck.length-1;i>0;i--){ let j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
    cards=deck; moves=0; matched=0;
  }
  renderCards();
  updateHUD();
}

function renderCards(){
  let grid=$('card-grid');
  grid.style.gridTemplateColumns=`repeat(${cols}, 1fr)`;
  grid.innerHTML='';
  cards.forEach((card,idx)=>{
    let div=document.createElement('div');
    div.className='card'+(card.flipped?' flipped':'')+(card.matched?' matched':'');
    div.innerHTML=`<div class="card-inner">
      <div class="card-face card-back">❓</div>
      <div class="card-face card-front">${card.value}</div>
    </div>`;
    div.onclick=()=>onCardClick(idx);
    grid.appendChild(div);
  });
}

function onCardClick(idx){
  if(busy) return;
  let card=cards[idx];
  if(card.flipped||card.matched) return;
  if(flipped.length>=2) return;
  card.flipped=true;
  flipped.push(idx);
  renderCards();
  playFlip();
  if(flipped.length===2){
    busy=true; moves++; updateHUD();
    let [i1,i2]=flipped;
    if(cards[i1].value===cards[i2].value){
      setTimeout(()=>{
        cards[i1].matched=true; cards[i2].matched=true;
        matched++; flipped=[]; busy=false;
        renderCards(); updateHUD(); playMatch();
        if(navigator.vibrate)navigator.vibrate(30);
        if(matched===cards.length/2) onWin();
        saveProgress();
      },400);
    } else {
      setTimeout(()=>{
        cards[i1].flipped=false; cards[i2].flipped=false;
        flipped=[]; busy=false;
        renderCards();
        saveProgress();
      },800);
    }
  }
}

function updateHUD(){
  $('level-display').textContent=level;
  $('moves-display').textContent=moves;
  $('matched-display').textContent=matched+'/'+(cards.length/2);
}

function onWin(){
  $('win-moves').textContent=moves;
  $('win-overlay').classList.remove('hidden');
  GV.Auth.updateCoins(15);
  saveProgress();
}
function nextLevel(){ level++; $('win-overlay').classList.add('hidden'); buildLevel(false); saveProgress(); }

let audioCtx=null;
function tone(f,d,v=0.15){
  try{
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    let o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.frequency.value=f;o.type='sine';
    g.gain.setValueAtTime(v,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);
    o.start();o.stop(audioCtx.currentTime+d);
  }catch(e){}
}
function playFlip(){ tone(400,0.08); }
function playMatch(){ tone(700,0.1); setTimeout(()=>tone(1000,0.15),80); }

function saveProgress(){
  GV.Save.set(GAME_ID,{level,moves,matched,cards,score:matched,savedAt:new Date().toISOString()});
}
function saveAndExit(){ saveProgress(); window.location.href='../index.html'; }

/* INIT */
let save=GV.Save.get(GAME_ID);
if(save&&save.cards&&save.cards.length>0){
  level=save.level||1; moves=save.moves||0; matched=save.matched||0; cards=save.cards;
  buildLevel(true);
} else {
  buildLevel(false);
}
</script>
</body>
</html>
